# rust.privateserver.im TURN/STUN profile
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET
realm=rust.privateserver.im
server-name=rust.privateserver.im
stale-nonce
no-multicast-peers
no-loopback-peers
no-cli

# Relay allocation range. Open this UDP range in the VPS firewall.
min-port=49160
max-port=49260

# Set this to the VPS public IP if coturn cannot determine it correctly.
# external-ip=203.0.113.10

# For TURN/TLS on 5349, point these at a certificate readable by coturn.
# cert=/etc/letsencrypt/live/rust.privateserver.im/fullchain.pem
# pkey=/etc/letsencrypt/live/rust.privateserver.im/privkey.pem
